<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contate-nos!</title>
</head>
<body>
    
<center><h2>Contate-Nos</h2></center>

<main>
    <section>
        <center><p>Estamos aqui para ouvir você! Se tiver alguma dúvida, sugestão ou precisar de ajuda, não hesite em nos contatar.</p></center>
        <hr>
    </section>
<section>
    <u><h3>Entre em Contato:</h3></u>
    <form action="nome">
        <label for="nome">Nome Completo:</label> <br>
        <input type="text" id="nome" name="nome">
        <br>
    <label for="gmail">Seu E-mail de Contato:</label>
    <br>
    <input type="email" id="email" name="email">
    <br>
    <label for="tel">Seu Telefone de Contato:</label>
    <br>
    <input type="tel" id="tel" name="tel">
    <br>
    <label for="assunto">Assunto:</label>
    <br>
    <input type="text" id="ass" name="assunto"> <br>
    <select name="assunto" id="assunto">
        <option value="duvida">Dúvida</option>
        <option value="sugestao">Sugestão</option>
        <option value="reclamacao">Reclamação</option>
    </select>
      <br><br>
       <button type="submit">Enviar</button>
    </form>  
</select>
    <hr>
</section>    
</main>
