<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<main>
        <section>
            <center><u><h2>Canal de Ouvidoria</h2></u></center>
            <center>
                <p>Teve alguma experiência marcante, deseja sugerir uma melhoria ou relatar um problema? <br>
                A Ouvidoria do Café Reale está pronta para ouvir você com total atenção e sigilo.</p>
            </center>
        </section>

        <hr>

        <section>
            <center>
                <u><h3>Formulário de Manifestação</h3></u>
                <form>
                    <p>
                        <label for="nome_ouvidoria">Seu Nome (Opcional):</label><br>
                        <input type="text" id="nome_ouvidoria" name="nome" size="40">
                    </p>
                    <p>
                        <label for="email_ouvidoria">E-mail para Retorno:</label><br>
                        <input type="email" id="email_ouvidoria" name="email" size="40" required>
                    </p>
                    <p>
                        <label for="tipo_manifestacao">Tipo de Manifestação:</label><br>
                        <select id="tipo_manifestacao" name="tipo">
                            <option value="elogio">Elogio</option>
                            <option value="sugestao">Sugestão</option>
                            <option value="reclamacao">Reclamação</option>
                        </select>
                    </p>
                    <p>
                        <label for="assunto">Assunto:</label><br>
                        <input type="text" id="assunto" name="assunto" size="40" required>
                    </p>
                    <p>
                        <label for="relato">Descreva sua manifestação:</label><br>
                        <textarea id="relato" name="relato" rows="5" cols="45" required></textarea>
                    </p>
                    <p>
                        <button type="submit">Enviar para a Ouvidoria</button>
                    </p>
                </form>
            </center>
        </section>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Café Reale. Todos os direitos reservados.</p>
        <ul>
            <li><a href="./index.html">Voltar para a Página Inicial</a></li>
        </ul>
    </footer>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
